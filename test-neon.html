<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Glow Test</title>
<style>
  body {
    background-color: #05040a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: system-ui, sans-serif;
  }
  .neon-card {
    background: #111;
    border: 1px solid #333;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    color: #fff;
    position: relative;
    box-shadow: 0 0 20px rgba(0, 242, 254, 0.1);
    transition: 0.3s;
  }
  .neon-card:hover {
    box-shadow: 0 0 40px rgba(0, 242, 254, 0.4);
  }
  .neon-title {
    font-family: monospace; font-size: 24px; color: #00f2fe; margin-bottom: 10px;
  }
  .neon-text {
    color: #888; font-size: 14px; margin-bottom: 30px;
  }
  
  /* EL BOTÓN DE NEÓN */
  .btn-neon {
    background: transparent;
    color: #00f2fe;
    border: 2px solid #00f2fe;
    padding: 12px 30px;
    font-size: 14px;
    font-family: monospace;
    text-transform: uppercase;
    letter-spacing: 2px;
    border-radius: 50px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: 0.3s;
    box-shadow: 0 0 10px #00f2fe, inset 0 0 10px #00f2fe;
  }
  
  .btn-neon:hover {
    background: #00f2fe;
    color: #000;
    box-shadow: 0 0 30px #00f2fe, inset 0 0 30px #fff;
  }

  /* EFECTO DE BARRIDO DE LUZ */
  .btn-neon::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    transition: 0.5s;
  }
  .btn-neon:hover::before {
    left: 100%;
  }
</style>
</head>
<body>
  <div class="neon-card">
    <div class="neon-title">Evidence Integrity OS</div>
    <div class="neon-text">Verificación Criptográfica Lista</div>
    <button class="btn-neon">Iniciar Escaneo</button>
  </div>
</body>
</html>
